server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to live GCP Cloud Run backend
    location /api/ {
        proxy_pass https://task-manager-backend-1085516927573.us-central1.run.app/api/;
        
        # Essential SSL settings for proxying to Cloud Run HTTPS host
        proxy_ssl_server_name on;
        proxy_ssl_name task-manager-backend-1085516927573.us-central1.run.app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host task-manager-backend-1085516927573.us-central1.run.app;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}